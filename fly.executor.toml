app = "schwab-executor"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile.executor"

[env]
  EXECUTOR_MANUAL_LIVE_ENABLED = "false"
  EXECUTOR_ALLOWED_SYMBOLS = ""
  EXECUTOR_MAX_NOTIONAL = "25"
  EXECUTOR_MAX_POSITIONS = "1"
  EXECUTOR_PLUGIN_STRATEGY_ID = "MANUAL_TEST1"
  EXECUTOR_PLUGIN_SHA256 = ""
  EXECUTOR_TOKEN_PATH = "/data/schwab_executor_token.json"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "schwab_executor_data"
  destination = "/data"

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[http_service]
  internal_port = 8080
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
