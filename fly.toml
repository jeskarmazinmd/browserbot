app = "schwab"
primary_region = "lax"

[build]

[processes]
  app = "python -u supervisor.py"

[env]
  ENABLE_G3_PAPER = "1"
  ENABLE_G4_PAPER = "1"
  G3_RETIREMENT_PLAN_PATH = "/app/GENERATION_THREE_RETIREMENT_PROPOSAL.json"
  # A 2 GB Fly volume exposes roughly 1.9 GB as usable filesystem capacity.
  # supervisor.py refuses startup on a silently replaced undersized volume.
  MIN_DATA_VOLUME_USABLE_MB = "1800"

[[vm]]
  memory = "8gb"
  cpu_kind = "shared"
  cpus = 8

[mounts]
  source = "schwab_data"
  destination = "/data"


[http_service]
  internal_port = 8080
  processes = ["app"]
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
